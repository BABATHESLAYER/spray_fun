<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spray Can Controller</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }

        .controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            padding: 15px;
            border-radius: 10px;
        }

        input[type="color"] {
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
        }

        input[type="range"] {
            width: 60%;
        }

        #spray-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #444, #111);
            border: 5px solid #555;
            color: #aaa;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 20px;
        }

        #spray-btn:active, #spray-btn.active {
            transform: scale(0.95);
            background: radial-gradient(circle at 30% 30%, #333, #000);
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            border-color: #e91e63;
            color: #e91e63;
        }

        .secondary-controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button.action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #444;
            color: white;
            font-size: 1rem;
            font-weight: bold;
        }

        button.action-btn:active {
            background: #666;
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="status" style="display:none;">
        <p>Tap to Enable Sensors</p>
    </div>

    <div class="controls">
        <input type="color" id="color-picker" value="#ff0000">
        <label style="font-size: 0.8rem; text-align: center;">Size<br><input type="range" id="size-slider" min="5" max="100" value="20"></label>
    </div>

    <div id="spray-btn">PUSH</div>

    <div class="secondary-controls">
        <button class="action-btn" id="recenter-btn">Recenter</button>
        <button class="action-btn" id="save-btn">Save Art</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/spray.js"></script>
</body>
</html>
